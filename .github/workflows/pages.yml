name: Deploy site to GitHub Pages

# Publishes the Skills Field Guide (the library) at the site root, with the
# Verdant design system kept at /design-system/ for reference. Brand fonts are
# the committed OFL faces, so the site renders in the real type.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/fonts
          # Site root IS the Skills Field Guide (the library) — no separate landing.
          # Ship the OFL fonts so the backend Verdant theme renders (@font-face → ./fonts/*).
          cp skills-database.html _site/index.html
          cp design-system/fonts/*.woff2 _site/fonts/ 2>/dev/null || true
          # Keep the Verdant design system reachable at /design-system/ (reference/admin).
          mkdir -p _site/design-system/fonts
          cp design-system/index.html design-system/tokens.css _site/design-system/
          [ -f design-system/README.md ] && cp design-system/README.md _site/design-system/ || true
          cp design-system/fonts/*.woff2 _site/design-system/fonts/ 2>/dev/null || true
          echo "Assembled:" && find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
